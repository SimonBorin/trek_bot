services:
  trek:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MONGO_HOST: trek_db
      MONGO_PORT: "27017"
      MONGO_USER: trek_user
      MONGO_PASS: ${MONGO_PASS}
      MONGO_AUTH_SOURCE: admin
    depends_on:
      - trek_db
    restart: unless-stopped

  trek_db:
    image: docker.io/library/mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: trek_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - trek_mongo_data:/data/db
    restart: unless-stopped

volumes:
  trek_mongo_data:
